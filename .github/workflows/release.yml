name: Release

# Tag a version (git tag v3.2.0 && git push origin v3.2.0) to publish a ready-to-load
# hirivo-extension.zip on GitHub Releases. The website's download button points at the latest one.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check the tag matches the manifest version
        run: |
          v=$(node -p "require('./public/manifest.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} but manifest says $v"; exit 1; }
      - run: cd dist && zip -r ../hirivo-extension.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: hirivo-extension.zip
          generate_release_notes: true
          body: |
            **Install:** download `hirivo-extension.zip`, unzip it, open `chrome://extensions`, turn on Developer mode, click **Load unpacked** and pick the unzipped folder.
